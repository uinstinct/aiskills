name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  rust:
    name: Rust build + test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --all-targets

  python:
    name: Python typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: uv sync
        run: uv sync --frozen --project src/internal

      - name: Smoke test skill_list.py
        run: uv run --project src/internal python src/internal/skill_list.py

  shell:
    name: Shell lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: shellcheck
        run: shellcheck install.sh scripts/package-release-assets.sh scripts/test-package-release-assets.sh scripts/test-install.sh

      - name: package-release-assets smoke test
        run: ./scripts/test-package-release-assets.sh

      - name: install.sh platform detection tests
        run: ./scripts/test-install.sh
