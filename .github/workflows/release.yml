name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-linux-x86_64:
    name: Build Linux x86_64 binary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo build --release
        run: cargo build --release --target x86_64-unknown-linux-gnu

      - name: Strip and rename binary
        run: |
          strip target/x86_64-unknown-linux-gnu/release/instinctagents
          mkdir -p dist
          cp target/x86_64-unknown-linux-gnu/release/instinctagents dist/instinctagents-linux-x86_64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: instinctagents-linux-x86_64
          path: dist/instinctagents-linux-x86_64

  build-macos-arm64:
    name: Build macOS arm64 binary
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo build --release
        run: cargo build --release --target aarch64-apple-darwin

      - name: Strip and rename binary
        run: |
          strip target/aarch64-apple-darwin/release/instinctagents
          mkdir -p dist
          cp target/aarch64-apple-darwin/release/instinctagents dist/instinctagents-macos-arm64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: instinctagents-macos-arm64
          path: dist/instinctagents-macos-arm64

  release:
    name: Package and publish release
    runs-on: ubuntu-latest
    needs: [build-linux-x86_64, build-macos-arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Package release tarballs
        run: ./scripts/package-release-assets.sh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/instinctagents-linux-x86_64
            dist/instinctagents-macos-arm64
            dist/skill-*.tar.gz
            dist/agents-md-*.tar.gz
