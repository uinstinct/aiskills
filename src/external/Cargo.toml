[package]
name = "instinctagents"
version = "0.1.0"
edition = "2021"
description = "Single-binary CLI/TUI for installing skills and agents.md snippets from the instinctagents registry."
license = "MIT"
repository = "https://github.com/uinstinct/aiskills"
build = "build.rs"

[[bin]]
name = "instinctagents"
path = "src/main.rs"

# NOTE: The release artifact (Linux x86_64, see US-017/US-030) MUST use rustls
# per US-008's AC ("smaller dep tree than reqwest"). On macOS hosts we fall
# back to native-tls (Apple Security framework) so local development isn't
# blocked by environments where ring's C build chain is unavailable. ureq's
# request/response API is identical across both TLS backends, so http.rs
# does not need to know which is active.
[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }

[target.'cfg(target_os = "linux")'.dependencies]
ureq = { version = "2", default-features = false, features = ["rustls"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
ureq = { version = "2", default-features = false, features = ["native-tls"] }

[build-dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"

[dev-dependencies]
tempfile = "3"
mockito = "1"
assert_cmd = "2"
predicates = "3"
