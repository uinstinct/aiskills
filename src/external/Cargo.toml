[package]
name = "instinctagents"
version = "0.1.0"
edition = "2021"
description = "Single-binary CLI/TUI for installing skills and agents.md snippets from the instinctagents registry."
license = "MIT"
repository = "https://github.com/uinstinct/aiskills"
build = "build.rs"

[[bin]]
name = "instinctagents"
path = "src/main.rs"

[build-dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"

[dev-dependencies]
tempfile = "3"
mockito = "1"
assert_cmd = "2"
predicates = "3"
